# Cabeceras de seguridad de dualab.es (app DuaLab en la raíz + web pública y Gestión web en /home/).
#
# El .htaccess de la raíz de public_html solo vive en el servidor (no lo sube deploy.sh: `dist/*`
# no incluye archivos ocultos). Este bloque se pega AL FINAL de ese archivo desde hPanel →
# Administrador de archivos, sin tocar las reglas de redirección que ya tiene. Para deshacerlo,
# basta con borrar el bloque.
#
# Puesta en marcha en dos pasos (la CSP mal ajustada puede dejar la web en blanco):
#   1. Pegar el bloque cambiando «Content-Security-Policy» por «Content-Security-Policy-Report-Only»:
#      no bloquea nada, solo avisa en la consola del navegador.
#   2. Abrir con la consola abierta (F12 → Consola): portada y contacto de la web, login y panel de
#      la app, un reto con vídeo o PDF, y Gestión web (con la vista previa). Si no aparece ningún
#      aviso «Content Security Policy», volver a poner «Content-Security-Policy».
# Comprobar después: ./scripts/comprobar-dominios.sh y
#   curl -sI https://dualab.es/ | grep -iE "strict-transport|content-security|x-frame"
#
# Qué permite la CSP y por qué:
#   script-src  → el bundle propio; el hash es el <script> en línea de index.html de la web
#                 (history.scrollRestoration): si se cambia ese script, hay que recalcular el hash;
#                 googletagmanager para Analytics (solo se carga tras aceptar las cookies)
#   style-src   → 'unsafe-inline' por los estilos que Vue pone en atributos style; Google Fonts por
#                 las fuentes que se elijan en Gestión web → Apariencia
#   img-src     → cualquier https: logos de empresas, Cloudinary, Unsplash, medios de la web
#   connect-src → las dos APIs y Google Analytics
#   frame-src   → vídeos de YouTube (modo sin cookies), PDF de Cloudinary y la vista previa de
#                 Gestión web (mismo dominio)
#   frame-ancestors 'self' (y X-Frame-Options SAMEORIGIN, no DENY): la vista previa de Gestión web
#                 incrusta la web en un iframe del mismo dominio

<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-x8AoaORovlX3U3Frn9/ZxLZFEZoxeMRCFYJA8gptKtQ=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://info.dualab.es https://res.cloudinary.com; connect-src 'self' https://api.dualab.es https://info.dualab.es https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' blob: https://www.youtube-nocookie.com https://res.cloudinary.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Header always unset X-Powered-By
</IfModule>
