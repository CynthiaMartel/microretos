# CI — debe pasar entero para hacer merge a develop/main (ver ~/.claude/CLAUDE.md, sección CI/CD).
# J1 Secretos · J2 SAST (Larastan nivel 8) · J3 Dependencias · build del frontend.
# Pendiente: eslint-plugin-security en el frontend (J2) y OWASP ZAP contra la API (J5).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: J1 · Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Escanea los commits del push/PR. Falsos positivos ya revisados: .gitleaksignore
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-php:
    name: J2 · SAST PHP (Larastan nivel 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'   # = config.platform.php de composer.json (producción)
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      # Larastan arranca la app: basta una APP_KEY desechable solo para este job.
      - name: Preparar entorno
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G --error-format=github

  dependencias:
    name: J3 · Dependencias (composer audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: composer audit
        run: composer audit --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-microretos/package-lock.json
      - name: npm audit
        working-directory: frontend-microretos
        run: npm audit --audit-level=high

  frontend:
    name: Build del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-microretos/package-lock.json
      - name: Instalar y compilar
        working-directory: frontend-microretos
        run: |
          npm ci
          npm run build
